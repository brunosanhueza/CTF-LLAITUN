name: "Inyeccion en el nucleo Siemens"
author: "Cristopher"
category: "ICS"
description: |
  Has dominado el proceso hidrico por Modbus. Pero el sistema de iluminacion de los departamentos de la SmartCity es otra historia: esta controlado por una red domotica industrial, y la interfaz Modbus que ya conoces no tiene acceso a esos registros. No importa que combinacion intentes, no vas a encender esas luces por ahi.

  Si encuentras la forma de actuar sobre ese subsistema, la rutina de entrega de la flag se desencadenara en el portal web de diagnostico del PLC.

  * La _flag_ aparece en el portal de diagnostico web del PLC mientras la iluminacion este activa.
  * El efecto no dura para siempre: ten el portal abierto antes de actuar.

  ![](https://github.com/pwnnisher/static/blob/main/512/matrix-512.jpg?raw=true)
value: 400
