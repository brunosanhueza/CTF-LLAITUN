hints:
  - content: "El puerto 502/TCP es la puerta de entrada. Investiga que protocolo industrial usa ese puerto y que herramientas existen para hablarlo (piensa en clientes tipo pymodbus, modpoll, QModMaster)."
    cost: 10
  - content: "Modbus organiza la memoria del PLC en 'holding registers' numerados desde 0. No necesitas credenciales, solo leer y escribir en la direccion correcta. Empieza por el principio del rango."
    cost: 25
  - content: "El primer registro no es un simple numero: es un conjunto de banderas empaquetadas bit a bit dentro de un mismo valor de 16 bits. Prueba escribiendo distintas potencias de 2 y observa que otros registros cambian justo despues."
    cost: 45

learned: "Modbus TCP has no authentication by design; any host that reaches port 502 can read and write process state. Coils/registers often pack several booleans into one 16-bit word, so single-bit writes (powers of 2) reveal hidden logic."
comment: "Easy. Entry point of Sector 3. Requires: (1) discovering Modbus on 502, (2) reading holding registers, (3) writing 256 (bit 8) to HR0, (4) reading HR1-HR7 quickly (payload auto-clears after a short rearm timer). Flag payload is stored leetspeak-encoded (R3B@l$e); both variants are accepted pending a decision on the canonical form. Only one write needed; no process-logic understanding required."
state: visible
