---
name: "Fuga en el sensor"
author: "Cristopher"
category: "ICS"
description: |
  El Sector 3 de la SmartCity simula la planta de tratamiento de agua de la ciudad. Un switch conecta el PLC de control, una Raspberry Pi y el panel HMI. Se ha detectado trafico no autorizado en la red del sector: algo, o alguien, esta hablando directamente con el proceso industrial sin pasar por ningun sistema de autenticacion.

  Antes de tocar nada, alguien te avisa que el puerto 502 del PLC esta abierto hacia la red del sector. Ese puerto es el estandar de un protocolo muy usado en automatizacion industrial y, por diseno, no pide contrasena.

  Tu primer objetivo es demostrar que puedes leer y escribir directamente sobre el proceso, y lograr que el sensor de nivel del Estanque 1 reporte algo que no deberia.

  * La _flag_ tiene el formato `Flag[XXXXXXX]`.
  * La informacion que buscas no se queda disponible para siempre: si la ves aparecer, capturala rapido.

  ![](https://github.com/pwnnisher/static/blob/main/512/matrix-512.jpg?raw=true)
value: 100
type: standard
connection_info: "REEMPLAZAR: IP del PLC en el segmento OT (puerto 502/TCP)"

flags:
  - Flag[REBALSE]
  - Flag[R3B@l$e]

tags:
