---
name: "El umbral que no deberia existir"
author: "Cristopher"
category: "ICS"
description: |
  Ya sabes mentirle al sensor. Ahora el objetivo es el panel HMI de la planta: su estado deberia reflejar la realidad del proceso, pero hay un valor "fuera de dominio" que ningun estado normal produce y que, bien aplicado, fuerza al sistema a comportarse de una manera que no deberia.

  El problema es que nadie te va a decir cual es ese valor, y tampoco hay manera sensata de probarlos todos. Alguien del equipo de mantenimiento si lo sabe, y lo documento en algun lugar. Encuentra el rango de falla y aprovechalo.

  La seguridad por oscuridad no es seguridad.

  * El estado que provocas no dura para siempre: se reordena solo despues de unos segundos.

  ![](https://github.com/pwnnisher/static/blob/main/512/matrix-512.jpg?raw=true)
value: 200
